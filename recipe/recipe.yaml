schema_version: 1

context:
  name: kimpy
  version: "2.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 7287c4696e42f27fa32f93da67162de2a58d92b2d93a62efd7da33d595e878df

build:
  number: 2
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - pkg-config
  host:
    - python
    - pip
    - setuptools
    - pybind11
    - kim-api >=2.3.0
  run:
    - python
    - pip
    - pybind11
    - pytest
    - numpy
    - kim-api >=2.3.0

tests:
  - python:
      imports:
        - kimpy
      pip_check: true

about:
  license: CDDL-1.0
  license_file: LICENSE.CDDL
  summary: Python interface to the KIM API
  description: |
    kimpy is a Python interface to the KIM API.
  homepage: https://github.com/openkim/kimpy
  repository: https://github.com/openkim/kimpy
  documentation: https://github.com/openkim/kimpy

extra:
  recipe-maintainers:
    - mjwen
    - ilia-nikiforov-umn
    - jan-janssen
